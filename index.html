<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>District Enrollment Progress</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#152033}.wrap{max-width:1200px;margin:auto;padding:22px}header,.card,.panel{background:#fff;border-radius:16px;padding:20px;box-shadow:0 3px 14px #0001}header{background:#12355b;color:#fff;margin-bottom:16px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.label{font-size:12px;color:#667085}.value{font-size:24px;font-weight:800}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-top:1px solid #eee;text-align:left}th{background:#f8fafc;font-size:12px}.num{text-align:right}.bar{height:8px;background:#1677c8;border-radius:9px}.track{height:8px;background:#e5eaf0;border-radius:9px;min-width:110px}.toolbar{display:flex;justify-content:space-between;padding-bottom:12px}input{padding:9px;border:1px solid #ccd3dd;border-radius:8px}@media(max-width:800px){.cards{grid-template-columns:2fr 2fr}.panel{overflow:auto}table{min-width:900px}}</style></head><body><div class="wrap"><header><h1>District Enrollment Progress</h1><div>Punjab • District level</div><div id="updated"></div></header><div class="cards"><div class="card"><div class="label">DISTRICTS</div><div id="n" class="value">—</div></div><div class="card"><div class="label">BASELINE</div><div id="b" class="value">—</div></div><div class="card"><div class="label">TARGET</div><div id="t" class="value">—</div></div><div class="card"><div class="label">LIVE CURRENT</div><div id="c" class="value">—</div></div></div><div class="panel"><div class="toolbar"><b>District-wise Progress</b><input id="q" placeholder="Search district" oninput="render()"></div><table><thead><tr><th>District</th><th>Baseline</th><th>New Target</th><th>Target</th><th>Current</th><th>Progress</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>let D={districts:[]};const f=x=>Number(x||0).toLocaleString();async function load(){let r=await fetch("data/district_progress.json?"+Date.now());if(!r.ok)throw Error();D=await r.json();updated.textContent="Last updated: "+new Date(D.updated_at).toLocaleString("en-PK",{timeZone:"Asia/Karachi"});n.textContent=D.districts.length;b.textContent=f(D.districts.reduce((a,x)=>a+x.baseline,0));t.textContent=f(D.districts.reduce((a,x)=>a+x.target,0));let l=D.districts.filter(x=>x.live_available);c.textContent=l.length?f(l.reduce((a,x)=>a+x.current,0)):"—";render()}function render(){let q=document.getElementById("q").value.toLowerCase();rows.innerHTML=D.districts.filter(x=>x.district.toLowerCase().includes(q)).map(x=>'<tr><td><b>'+x.district+'</b></td><td>'+f(x.baseline)+'</td><td>'+f(x.new_target)+'</td><td>'+f(x.target)+'</td><td>'+(x.live_available?f(x.current):"—")+'</td><td>'+(x.live_available?'<div style="display:flex;gap:8px;align-items:center"><div class="track"><div class="bar" style="width:'+x.progress_pct+'%"></div></div>'+x.progress_pct+'%</div>':"—")+'</td><td>'+(x.live_available?"Live":"Awaiting live source")+'</td></tr>').join("")}load().catch(()=>{document.body.insertAdjacentHTML("afterbegin",'<div style="padding:20px;background:#fff4e5">Daily data not generated yet. Run the GitHub Action.</div>')});</script></body></html>
