<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Punjab District Enrollment Progress</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--blue:#0b5ed7;--dark:#17345f;--bg:#f4f7fb;--card:#fff;--line:#dfe5ee;--muted:#667085;--red:#c62828;--green:#16803c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:"Segoe UI",Arial,sans-serif;color:#172033}
header{background:linear-gradient(135deg,#12315b,#0b5ed7);color:#fff;padding:20px 24px}
header .wrap{max-width:1550px;margin:auto;padding:0}
header h1{margin:0;font-size:24px}
header p{margin:5px 0 0;opacity:.9;font-size:13px}
.wrap{max-width:1550px;margin:auto;padding:18px}
.status{font-size:12px;margin-top:6px;opacity:.92}
.live-badge{display:inline-block;margin-top:8px;background:#ffffff1c;border:1px solid #ffffff45;border-radius:14px;padding:4px 10px;font-size:10px;font-weight:700}
.live-dot{display:inline-block;width:6px;height:6px;background:#62d88b;border-radius:50%;margin-right:5px}
.cards{display:grid;grid-template-columns:repeat(7,minmax(125px,1fr));gap:10px;margin-bottom:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px;box-shadow:0 2px 8px #00000008}
.label{font-size:11px;color:var(--muted)}
.value{font-size:20px;font-weight:700;margin-top:4px;color:#172033}
.tabs{display:flex;gap:5px;margin:0 0 4px}.tab{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:7px 13px;font-weight:600;color:#17345f}.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);padding:8px;border-radius:11px;margin-bottom:6px}
.toolbar input{padding:8px 9px;border:1px solid #cbd5e1;border-radius:7px;min-width:240px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}
.action{border:0;border-radius:7px;padding:8px 11px;background:#0f766e;color:#fff;font-weight:600;cursor:pointer;font-size:11px}
.pdf{background:#b42318}
.action:hover{opacity:.9}
.tablebox{background:#fff;border:1px solid var(--line);border-radius:11px;overflow:auto;max-height:70vh}
table{border-collapse:collapse;width:100%;font-size:11px}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:center}
th{position:sticky;top:0;background:#edf4fd;color:#17345f;z-index:2;font-weight:700}
th:first-child,td:first-child{text-align:center}
.district{font-weight:700}
.num{font-variant-numeric:tabular-nums}
.achievement{font-weight:700}
.good{color:var(--green)}.bad{color:var(--red)}
.track{height:7px;background:#e6ebf0;border-radius:8px;min-width:70px;display:inline-block;vertical-align:middle;overflow:hidden}
.bar{height:7px;background:#0b5ed7;border-radius:8px}
.sno{font-weight:700;color:#5d6b7e}
.total-row td{background:#edf4fd!important;font-weight:800;color:#17345f;border-top:2px solid #b9cbe0}
.note{font-size:11px;color:var(--muted);margin:7px 0 11px}
.updated{font-size:12px;margin-top:6px}
.page-shell{width:100%;min-height:100vh}
.header-inner{width:100%;padding:20px 28px}
.main-content{width:100%;padding:16px 28px 28px}
.cards{width:100%;margin-bottom:2px}
.panel{width:100%;background:#fff;border:1px solid var(--line);border-radius:11px;padding:6px}
.table-wrap{width:100%;overflow:auto;max-height:calc(100vh - 285px)}
.table-wrap table{width:100%;min-width:0;table-layout:auto}
@media(min-width:1051px){th,td{padding:9px 10px}.district{min-width:150px}.table-wrap{min-height:420px}}
@media(max-width:1050px){.cards{grid-template-columns:repeat(4,1fr)}}
@media(max-width:650px){
 .wrap{padding:9px}
 header{padding:16px 12px}
 header h1{font-size:20px}
 header p{font-size:11px}
 .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
 .card{padding:10px;min-height:65px}
 .label{font-size:9px}.value{font-size:16px}
 .toolbar{padding:9px;align-items:stretch}
 .toolbar input{min-width:100%;width:100%}
 .actions{display:grid;grid-template-columns:1fr 1fr;width:100%;margin-left:0}
 .action{width:100%;padding:10px 6px}
 .tablebox{max-height:none;-webkit-overflow-scrolling:touch}
 table{min-width:790px;font-size:10px}
 th,td{padding:7px 6px}
}
</style>
</head>
<body><div class="page-shell">
<header>
 <div class="header-inner">
  <h1>Punjab District-wise Enrollment Progress</h1>
  <p>Dashboard developed by M.Sajid AEO Markaz Amli Moti (W)</p>
  <div id="updated" class="updated">Latest SIS report: Loading…</div>
 </div>
</header>

<main class="main-content"><div class="cards">
<div class="card"><div class="label">Districts</div><div id="n" class="value">—</div></div>
<div class="card"><div class="label">Baseline 2026</div><div id="b" class="value">—</div></div>
<div class="card"><div class="label">Target 2026</div><div id="t" class="value">—</div></div>
<div class="card"><div class="label">Expected Enrollment</div><div id="e" class="value">—</div></div>
<div class="card"><div class="label">Current Enrollment</div><div id="c" class="value">—</div></div>
<div class="card"><div class="label">New Admission 2026</div><div id="a" class="value">—</div></div>
<div class="card"><div class="label">Target Achievement</div><div id="overall" class="value">—</div></div>
</div></div>

<div class="tabs"><button class="tab active" type="button">District Wise</button></div>
<div class="panel"><div class="toolbar"><div style="font-weight:700;color:#17345f">District Enrollment Report</div>
  
  <div class="actions"><input id="q" placeholder="Search district" oninput="render()"><button class="secondary" onclick="downloadExcel()">Download Excel</button><button onclick="downloadPDF()">Download PDF</button></div>
</div>
<div class="table-wrap"><table id="dataTable"><thead><tr id="headRow"></tr></thead><tbody id="rows"></tbody></table></div>
</main></div>
<script>
let D={districts:[]};
const f=x=>Number(x||0).toLocaleString("en-US");
const dateLabel=()=>{const d=new Date(D.updated_at);return d.toLocaleDateString("en-GB",{day:"2-digit",month:"2-digit",year:"numeric"})};
const dateShort=()=>{const d=new Date(D.updated_at);return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})};
function pct(x){return Number(x||0)}
function sorted(){
 const q=document.getElementById("q").value.toLowerCase();
 return D.districts.filter(x=>x.district.toLowerCase().includes(q)).sort((a,b)=>pct(b.progress_pct)-pct(a.progress_pct));
}
function headings(){
 const h=["S.No.","District","Baseline 2026","Target 2026","Expected Enrollment 2026","Current Enrollment<br><small>"+dateShort()+"</small>","New admission 2026","Target achieved"];
 document.getElementById("headRow").innerHTML=h.map(x=>"<th>"+x+"</th>").join("");
}
async function load(){
 const r=await fetch("data/district_progress.json?"+Date.now()); if(!r.ok)throw Error("data unavailable");
 D=await r.json(); headings();
 document.getElementById("updated").textContent="Last Updated at: "+new Date(D.updated_at).toLocaleString("en-PK",{timeZone:"Asia/Karachi"});
 const ds=D.districts;
 document.getElementById("n").textContent=D.district_count||ds.length;
 document.getElementById("b").textContent=f(ds.reduce((a,x)=>a+Number(x.baseline||0),0));
 document.getElementById("t").textContent=f(ds.reduce((a,x)=>a+Number(x.new_target||0),0));
 document.getElementById("e").textContent=f(ds.reduce((a,x)=>a+Number(x.target||0),0));
 document.getElementById("c").textContent=f(D.current_total||ds.reduce((a,x)=>a+Number(x.current||0),0));
 document.getElementById("a").textContent=f(ds.reduce((a,x)=>a+Number(x.increase||0),0));
 const overall=ds.length?ds.reduce((a,x)=>a+Number(x.progress_pct||0),0)/ds.length:0;
 document.getElementById("overall").textContent=overall.toFixed(2)+"%";
 render();
}
function render(){
 const rows=sorted().map((x,i)=>{
   const p=pct(x.progress_pct), width=Math.max(0,Math.min(100,p)), cls=p>=100?"good":"bad";
   return "<tr><td class='sno'>"+(i+1)+"</td><td class='district'>"+x.district+"</td><td class='num'>"+f(x.baseline)+"</td><td class='num'>"+f(x.new_target)+"</td><td class='num'>"+f(x.target)+"</td><td class='num'>"+f(x.current)+"</td><td class='num'>"+f(x.increase)+"</td><td class='achievement "+cls+"'><div class='track'><div class='bar' style='width:"+width+"%'></div></div> "+p.toFixed(2)+"%</td></tr>";
 }).join("");
 const ds=D.districts,total=k=>ds.reduce((a,x)=>a+Number(x[k]||0),0);
 const tp=ds.length?ds.reduce((a,x)=>a+Number(x.progress_pct||0),0)/ds.length:0;
 const totalRow="<tr class='total-row'><td class='sno'>—</td><td>TOTAL</td><td class='num'>"+f(total("baseline"))+"</td><td class='num'>"+f(total("new_target"))+"</td><td class='num'>"+f(total("target"))+"</td><td class='num'>"+f(D.current_total||total("current"))+"</td><td class='num'>"+f(total("increase"))+"</td><td class='achievement'>"+tp.toFixed(2)+"%</td></tr>";
 document.getElementById("rows").innerHTML=rows+totalRow;
}
function exportRows(){
 return sorted().map((x,i)=>({"S.No.":i+1,"District":x.district,"Baseline 2026":x.baseline,"Target 2026":x.new_target,"Expected Enrollment 2026":x.target,["Current Enrollment "+dateShort()]:x.current,"New admission 2026":x.increase,"Target achieved":x.progress_pct+"%"}));
}
function downloadExcel(){
 const ws=XLSX.utils.json_to_sheet(exportRows());const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"District Progress");
 XLSX.writeFile(wb,"Punjab_District_Enrollment_Progress.xlsx");
}
function downloadPDF(){
 const {jsPDF}=window.jspdf;
 const doc=new jsPDF("p","mm","a4");
 const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();
 const ds=D.districts;
 const sum=k=>ds.reduce((a,x)=>a+Number(x[k]||0),0);
 const navy=[36,73,111],head=[216,231,245],line=[205,215,225],text=[45,58,73];
 const reportDate=new Date(D.updated_at).toLocaleString("en-PK",{timeZone:"Asia/Karachi"});
 const margin=6,tableWidth=W-(margin*2);
 const footer=()=>{
   doc.setDrawColor(...line);doc.line(margin,H-7,W-margin,H-7);
   doc.setFont("helvetica","normal");doc.setFontSize(5.5);doc.setTextColor(105,117,130);
   doc.text("Punjab District-wise Enrollment Dashboard • SIS PESRP",margin,H-3);
   doc.text("Page "+doc.internal.getNumberOfPages(),W-20,H-3);
 };
 const header=()=>{
   doc.setTextColor(...navy);doc.setFont("helvetica","bold");
   doc.setFontSize(13);doc.text("Punjab District-wise Enrollment Dashboard",W/2,7,{align:"center"});
   doc.setFontSize(8);doc.text("District Enrollment Progress • SIS PESRP",W/2,12,{align:"center"});
   doc.setFont("helvetica","normal");doc.setFontSize(6.2);doc.setTextColor(85,98,113);
   doc.text("Latest SIS report: "+reportDate,W/2,17,{align:"center"});
 };
 header();

 const boxes=[
  ["Districts",D.district_count||ds.length],["Baseline 2026",sum("baseline")],["Target 2026",sum("new_target")],
  ["Expected Enrollment",sum("target")],["Current Enrollment",D.current_total||sum("current")],
  ["New Admission 2026",sum("increase")],["Target Achievement",(ds.length?ds.reduce((a,x)=>a+Number(x.progress_pct||0),0)/ds.length:0).toFixed(2)+"%"]
 ];
 const gap=1.8,left=margin,bw=(tableWidth-gap*6)/7;let x=left;
 boxes.forEach(b=>{
   doc.setFillColor(245,247,250);doc.setDrawColor(...line);doc.roundedRect(x,20,bw,12,1.2,1.2,"FD");
   doc.setFont("helvetica","normal");doc.setFontSize(4.5);doc.setTextColor(95,108,122);
   doc.text(b[0],x+bw/2,25,{align:"center"});
   doc.setFont("helvetica","bold");doc.setFontSize(7.2);doc.setTextColor(...navy);
   doc.text(String(b[1]),x+bw/2,30,{align:"center"});
   x+=bw+gap;
 });

 const rows=sorted().map((v,i)=>[
   i+1,v.district,f(v.baseline),f(v.new_target),f(v.target),f(v.current),f(v.increase),pct(v.progress_pct).toFixed(2)+"%"
 ]);

 // Compact but readable widths: the complete table is constrained to the printable A4 width.
 const weights=[0.055,0.18,0.12,0.12,0.16,0.16,0.105,0.10];
 const widths=weights.map(v=>tableWidth*v);

 doc.autoTable({
   startY:35,
   margin:{left:margin,right:margin,bottom:9},
   tableWidth:tableWidth,
   head:[["S.No.","District","Baseline 2026","Target 2026","Expected Enrollment 2026","Current Enrollment\n"+dateShort(),"New Admission 2026","Target Achieved"]],
   body:rows,
   theme:"grid",
   styles:{
     font:"helvetica",fontSize:6.4,cellPadding:1.05,halign:"center",valign:"middle",
     lineColor:line,lineWidth:.15,textColor:text,overflow:"linebreak",
     minCellHeight:5.1
   },
   headStyles:{
     fillColor:head,textColor:navy,fontStyle:"bold",fontSize:5.9,
     halign:"center",valign:"middle",cellPadding:1.15,minCellHeight:8
   },
   alternateRowStyles:{fillColor:[251,252,253]},
   columnStyles:{
     0:{cellWidth:widths[0],halign:"center"},
     1:{cellWidth:widths[1],halign:"center"},
     2:{cellWidth:widths[2],halign:"center"},
     3:{cellWidth:widths[3],halign:"center"},
     4:{cellWidth:widths[4],halign:"center"},
     5:{cellWidth:widths[5],halign:"center"},
     6:{cellWidth:widths[6],halign:"center"},
     7:{cellWidth:widths[7],halign:"center"}
   },
   didParseCell:d=>{
     if(d.section==="body"&&d.column.index===7){
       const v=parseFloat(String(d.cell.raw).replace("%",""));
       d.cell.styles.textColor=v>=100?[22,128,60]:[198,40,40];
       d.cell.styles.fontStyle="bold";
     }
   },
   didDrawPage:d=>{if(doc.internal.getNumberOfPages()>1)header();footer();}
 });

 // No totals/summary strip at the end: the district table is the final report content.
 footer();
 doc.save("Punjab_District_Enrollment_Progress.pdf");
}

load().catch(()=>document.getElementById("updated").textContent="Daily SIS data is not available yet. Run the GitHub Action.");
</script>
</body></html>
