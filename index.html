<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Punjab District Enrollment Progress</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#fff;color:#23364d}
.wrap{max-width:1500px;margin:auto;padding:18px 22px}
header{text-align:center;padding:8px 0 12px;background:#fff;box-shadow:none}
.brand{font-size:25px;font-weight:800;color:#24496f;letter-spacing:-.3px}
h1{margin:0;font-size:25px;color:#24496f;font-weight:800}
.subtitle{margin-top:4px;font-size:14px;color:#4f6278;font-weight:700}
.updated{margin-top:7px;font-size:12px;color:#667789}
.live-badge{display:inline-block;margin-top:6px;background:#edf4fb;color:#24537d;border:1px solid #cbd9e7;border-radius:14px;padding:4px 10px;font-size:10px;font-weight:800}
.live-dot{display:inline-block;width:6px;height:6px;background:#2b9b5a;border-radius:50%;margin-right:5px}
.cards{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin:8px 8px 14px}
.card{background:#f5f7fa;border:1px solid #d8e0e8;border-radius:8px;padding:11px 8px;text-align:center;min-height:72px;box-shadow:0 1px 3px #23364d10}
.label{font-size:10px;color:#657487;line-height:1.2}
.value{font-size:16px;font-weight:800;margin-top:7px;color:#24496f}
.panel{background:#fff;border:0;border-radius:0;box-shadow:none;overflow:visible}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 2px 9px;flex-wrap:wrap}
.toolbar-title{font-size:18px;font-weight:800;color:#24496f}.toolbar-sub{font-size:11px;color:#667789;margin-top:2px}
.actions{display:flex;gap:7px;flex-wrap:wrap}
button{border:1px solid #28557f;border-radius:6px;padding:8px 12px;cursor:pointer;font-weight:700;background:#28557f;color:#fff;font-size:11px}
button.secondary{background:#fff;color:#28557f}
button:hover{opacity:.9}
input{padding:8px 10px;border:1px solid #cbd5df;border-radius:6px;min-width:210px;font-size:11px}
.table-wrap{overflow-x:auto;width:100%}
table{width:100%;border-collapse:collapse;min-width:0;width:100%}
th,td{padding:7px 7px;border:1px solid #d4dde6;text-align:center}
thead th{background:#d8e7f5;color:#24496f;font-size:10px;white-space:nowrap;font-weight:800;text-align:center}
tbody td{font-size:10.5px;background:#fff}
tbody tr:nth-child(even) td{background:#fbfcfd}
tbody tr:hover td{background:#f4f8fc}
.sno{text-align:center;color:#607287;font-weight:700;width:45px}
.district{font-weight:700;color:#30465e;text-align:center}
.num{text-align:center;font-variant-numeric:tabular-nums}
.achievement{font-weight:800;white-space:nowrap;text-align:center}
.good{color:#16803c}.bad{color:#c62828}
.track{height:7px;background:#e6ebf0;border-radius:8px;min-width:65px;display:inline-block;vertical-align:middle;overflow:hidden}
.bar{height:7px;background:#2b79b7;border-radius:8px}
.total-row td{background:#e5f2e8!important;font-weight:800;color:#24496f}
.note{font-size:10px;color:#657487;padding:9px 2px}
.legend{margin-left:10px}.legend .g{color:#16803c;font-weight:800}.legend .r{color:#c62828;font-weight:800}
@media(max-width:1200px){.cards{grid-template-columns:repeat(4,1fr)}}
@media(max-width:650px){.cards{grid-template-columns:repeat(2,1fr)}.wrap{padding:10px}h1,.brand{font-size:21px}}
</style>
</head>
<body><div class="wrap">
<header>
  <div class="brand">Punjab District-wise Enrollment Dashboard</div>
  <div class="subtitle">District Enrollment Progress • SIS PESRP</div>
  <div id="updated" class="updated">Latest SIS report: Loading…</div>
  <div class="live-badge"><span class="live-dot"></span> LIVE SIS DATA</div>
</header>

<div class="cards">
<div class="card"><div class="label">Districts</div><div id="n" class="value">—</div></div>
<div class="card"><div class="label">Baseline 2026</div><div id="b" class="value">—</div></div>
<div class="card"><div class="label">Target 2026</div><div id="t" class="value">—</div></div>
<div class="card"><div class="label">Expected Enrollment</div><div id="e" class="value">—</div></div>
<div class="card"><div class="label">Current Enrollment</div><div id="c" class="value">—</div></div>
<div class="card"><div class="label">New Admission 2026</div><div id="a" class="value">—</div></div>
<div class="card"><div class="label">Target Achievement</div><div id="overall" class="value">—</div></div>
</div>

<div class="panel"><div class="toolbar">
  
  <div class="actions"><input id="q" placeholder="Search district" oninput="render()"><button class="secondary" onclick="downloadExcel()">Download Excel</button><button onclick="downloadPDF()">Download PDF</button></div>
</div>
<div class="table-wrap"><table id="dataTable"><thead><tr id="headRow"></tr></thead><tbody id="rows"></tbody></table></div>
</div></div>
<script>
let D={districts:[]};
const f=x=>Number(x||0).toLocaleString("en-US");
const dateLabel=()=>{const d=new Date(D.updated_at);return d.toLocaleDateString("en-GB",{day:"2-digit",month:"2-digit",year:"numeric"})};
const dateShort=()=>{const d=new Date(D.updated_at);return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})};
function pct(x){return Number(x||0)}
function sorted(){
 const q=document.getElementById("q").value.toLowerCase();
 return D.districts.filter(x=>x.district.toLowerCase().includes(q)).sort((a,b)=>pct(b.progress_pct)-pct(a.progress_pct));
}
function headings(){
 const h=["S.No.","District","Baseline 2026","Target 2026","Expected Enrollment 2026","Current Enrollment<br><small>"+dateShort()+"</small>","New admission 2026","Target achieved"];
 document.getElementById("headRow").innerHTML=h.map(x=>"<th>"+x+"</th>").join("");
}
async function load(){
 const r=await fetch("data/district_progress.json?"+Date.now()); if(!r.ok)throw Error("data unavailable");
 D=await r.json(); headings();
 document.getElementById("updated").textContent="Last Updated at: "+new Date(D.updated_at).toLocaleString("en-PK",{timeZone:"Asia/Karachi"});
 const ds=D.districts;
 document.getElementById("n").textContent=D.district_count||ds.length;
 document.getElementById("b").textContent=f(ds.reduce((a,x)=>a+Number(x.baseline||0),0));
 document.getElementById("t").textContent=f(ds.reduce((a,x)=>a+Number(x.new_target||0),0));
 document.getElementById("e").textContent=f(ds.reduce((a,x)=>a+Number(x.target||0),0));
 document.getElementById("c").textContent=f(D.current_total||ds.reduce((a,x)=>a+Number(x.current||0),0));
 document.getElementById("a").textContent=f(ds.reduce((a,x)=>a+Number(x.increase||0),0));
 const overall=ds.length?ds.reduce((a,x)=>a+Number(x.progress_pct||0),0)/ds.length:0;
 document.getElementById("overall").textContent=overall.toFixed(2)+"%";
 render();
}
function render(){
 const rows=sorted().map((x,i)=>{
   const p=pct(x.progress_pct), width=Math.max(0,Math.min(100,p)), cls=p>=100?"good":"bad";
   return "<tr><td class='sno'>"+(i+1)+"</td><td class='district'>"+x.district+"</td><td class='num'>"+f(x.baseline)+"</td><td class='num'>"+f(x.new_target)+"</td><td class='num'>"+f(x.target)+"</td><td class='num'>"+f(x.current)+"</td><td class='num'>"+f(x.increase)+"</td><td class='achievement "+cls+"'><div class='track'><div class='bar' style='width:"+width+"%'></div></div> "+p.toFixed(2)+"%</td></tr>";
 }).join("");
 const ds=D.districts,total=k=>ds.reduce((a,x)=>a+Number(x[k]||0),0);
 const tp=ds.length?ds.reduce((a,x)=>a+Number(x.progress_pct||0),0)/ds.length:0;
 const totalRow="<tr class='total-row'><td class='sno'>—</td><td>TOTAL</td><td class='num'>"+f(total("baseline"))+"</td><td class='num'>"+f(total("new_target"))+"</td><td class='num'>"+f(total("target"))+"</td><td class='num'>"+f(D.current_total||total("current"))+"</td><td class='num'>"+f(total("increase"))+"</td><td class='achievement'>"+tp.toFixed(2)+"%</td></tr>";
 document.getElementById("rows").innerHTML=rows+totalRow;
}
function exportRows(){
 return sorted().map((x,i)=>({"S.No.":i+1,"District":x.district,"Baseline 2026":x.baseline,"Target 2026":x.new_target,"Expected Enrollment 2026":x.target,["Current Enrollment "+dateShort()]:x.current,"New admission 2026":x.increase,"Target achieved":x.progress_pct+"%"}));
}
function downloadExcel(){
 const ws=XLSX.utils.json_to_sheet(exportRows());const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"District Progress");
 XLSX.writeFile(wb,"Punjab_District_Enrollment_Progress.xlsx");
}
function downloadPDF(){
 const {jsPDF}=window.jspdf;const doc=new jsPDF("l","mm","a4");
 const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();
 const ds=D.districts,sum=k=>ds.reduce((a,x)=>a+Number(x[k]||0),0);
 const navy=[36,73,111],head=[216,231,245],totalBg=[229,242,232],line=[205,215,225],text=[45,58,73];
 const reportDate=new Date(D.updated_at).toLocaleString("en-PK",{timeZone:"Asia/Karachi"});
 const footer=()=>{doc.setDrawColor(...line);doc.line(12,H-12,W-12,H-12);doc.setFont("helvetica","normal");doc.setFontSize(7);doc.setTextColor(105,117,130);doc.text("Punjab District-wise Enrollment Dashboard • SIS PESRP",12,H-6);doc.text("Page "+doc.internal.getNumberOfPages(),W-25,H-6);};
 const header=()=>{doc.setTextColor(...navy);doc.setFont("helvetica","bold");doc.setFontSize(16);doc.text("Punjab District-wise Enrollment Dashboard",W/2,10,{align:"center"});doc.setFontSize(10);doc.text("District Enrollment Progress • SIS PESRP",W/2,16,{align:"center"});doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(85,98,113);doc.text("Latest SIS report: "+reportDate,W/2,22,{align:"center"});};
 header();
 const boxes=[
  ["Districts",D.district_count||ds.length],["Baseline 2026",sum("baseline")],["Target 2026",sum("new_target")],
  ["Expected Enrollment",sum("target")],["Current Enrollment",D.current_total||sum("current")],["New Admission 2026",sum("increase")],
  ["Target Achievement",(ds.length?ds.reduce((a,x)=>a+Number(x.progress_pct||0),0)/ds.length:0).toFixed(2)+"%"]
 ];
 const gap=4,left=12,bw=(W-24-gap*6)/7;let x=left;
 boxes.forEach(b=>{doc.setFillColor(245,247,250);doc.setDrawColor(...line);doc.roundedRect(x,28,bw,17,2,2,"FD");doc.setFont("helvetica","normal");doc.setFontSize(6.2);doc.setTextColor(95,108,122);doc.text(b[0],x+bw/2,34,{align:"center"});doc.setFont("helvetica","bold");doc.setFontSize(9.5);doc.setTextColor(...navy);doc.text(String(b[1]),x+bw/2,41,{align:"center"});x+=bw+gap;});
 const rows=sorted().map((v,i)=>[i+1,v.district,f(v.baseline),f(v.new_target),f(v.target),f(v.current),f(v.increase),pct(v.progress_pct).toFixed(2)+"%"]);
 doc.autoTable({
  startY:49,margin:{left:12,right:12,bottom:17},
  head:[["S.No.","District","Baseline 2026","Target 2026","Expected Enrollment 2026","Current Enrollment\n"+dateShort(),"New admission 2026","Target achieved"]],
  body:rows,theme:"grid",
  styles:{font:"helvetica",fontSize:7,cellPadding:2.2,halign:"center",valign:"middle",lineColor:line,lineWidth:.2,textColor:text},
  headStyles:{fillColor:head,textColor:navy,fontStyle:"bold",fontSize:6.7,halign:"center",valign:"middle"},
  alternateRowStyles:{fillColor:[251,252,253]},
  columnStyles:{0:{cellWidth:12,halign:"center"},1:{cellWidth:42,halign:"center"},2:{cellWidth:27,halign:"center"},3:{cellWidth:27,halign:"center"},4:{cellWidth:36,halign:"center"},5:{cellWidth:36,halign:"center"},6:{cellWidth:31,halign:"center"},7:{cellWidth:29,halign:"center"}},
  didParseCell:d=>{if(d.section==="body"&&d.column.index===7){const v=parseFloat(String(d.cell.raw).replace("%",""));d.cell.styles.textColor=v>=100?[22,128,60]:[198,40,40];d.cell.styles.fontStyle="bold";}},
  didDrawPage:d=>{if(doc.internal.getNumberOfPages()>1)header();footer();}
 });
 let y=doc.lastAutoTable.finalY+5;if(y>H-26){doc.addPage();header();y=34;}
 const totals=[D.district_count||ds.length,sum("baseline"),sum("new_target"),sum("target"),D.current_total||sum("current"),sum("increase")];
 doc.setFillColor(...totalBg);doc.setDrawColor(190,210,195);doc.rect(12,y-4,W-24,14,"FD");
 doc.setFont("helvetica","bold");doc.setFontSize(7.5);doc.setTextColor(...navy);doc.text("TOTAL",15,y+2);
 doc.setFont("helvetica","normal");doc.text("Districts: "+totals[0]+"   •   Baseline: "+f(totals[1])+"   •   Target: "+f(totals[2])+"   •   Expected: "+f(totals[3])+"   •   Current: "+f(totals[4])+"   •   New Admission: "+f(totals[5]),32,y+2);
 footer();doc.save("Punjab_District_Enrollment_Progress.pdf");
}

load().catch(()=>document.getElementById("updated").textContent="Daily SIS data is not available yet. Run the GitHub Action.");
</script>
</body></html>
