name: Map SIS District IDs
on:
  push:
    paths:
      - "map_sis_ids.py"
      - ".github/workflows/map-sis-ids.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python map_sis_ids.py