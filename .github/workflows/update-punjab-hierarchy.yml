name: Update Punjab All-Level Dashboard
on:
  workflow_dispatch:
  push:
    paths:
      - "update_punjab_hierarchy.py"
      - "all-level-dashboard.html"
      - "index.html"
      - "data/master.csv"
      - "data/master_schema.csv"
      - ".github/workflows/update-punjab-hierarchy.yml"
  schedule:
    - cron: "0 2 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-repair
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python -u update_punjab_hierarchy.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
