name: Update Punjab All-Level Dashboard
on:
  workflow_dispatch:
  push:
    paths:
      - "update_punjab_hierarchy.py"
      - "all-level-dashboard.html"
      - "index.html"
      - "data/master.csv"
      - "data/master_schema.csv"
      - ".github/workflows/update-punjab-hierarchy.yml"
  schedule:
    - cron: "0 2,8,14,20 * * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages-repair
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Fetch latest live SIS school-level enrollment and build dashboard data
        id: live_crawl
        run: python -u update_punjab_hierarchy.py
      - name: Commit generated dashboard data for branch-based Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/punjab_summary.json data/punjab_schools.json data/unclassified_schools.csv
          if ! git diff --cached --quiet; then
            git commit -m "Publish generated Punjab dashboard data"
            git push origin HEAD:main
          else
            echo "Generated data files unchanged."
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
