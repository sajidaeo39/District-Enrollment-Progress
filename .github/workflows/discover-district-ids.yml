name: Discover SIS District IDs
on:
  push:
    paths:
      - ".github/workflows/discover-district-ids.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install requests
      - run: python discover_district_ids.py
