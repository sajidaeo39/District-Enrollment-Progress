name: Update District Enrollment Dashboard

on:
  schedule:
    - cron: "0 3 * * *" # 08:00 PKT (UTC+5)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Fetch live SIS enrollment and build JSON
        run: python update_district_progress.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/district_progress.json
          git diff --cached --quiet || git commit -m "Update district enrollment data"
          git push

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
